name: Modelos econométricos

on:
  schedule:
    - cron: "17 10 * * *"   # uma vez por dia, 7h17 de Brasília (IPCA e IGP-M são mensais)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  modelos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Testar o motor antes de publicar
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Estimar modelos e fazer o backtest
        run: python scripts/modelos.py
      - name: Salvar se mudou
        run: |
          git config user.name "econoia-robo"
          git config user.email "robo@users.noreply.github.com"
          git add data/modelos.json
          git diff --cached --quiet || git commit -m "Modelos atualizados $(TZ=America/Sao_Paulo date '+%d/%m %H:%M') [skip ci]"
          git pull --rebase origin main && git push
