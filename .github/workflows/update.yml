name: Atualizar dados da EconoIA

on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 minutos (horário UTC; o GitHub pode atrasar alguns minutos)
  workflow_dispatch:          # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar dados (BCB, IBGE, bolsa)
        run: python scripts/update.py
      - name: Salvar se mudou
        run: |
          git config user.name "econoia-robo"
          git config user.email "robo@users.noreply.github.com"
          git add data/data.json
          git diff --cached --quiet || git commit -m "Dados atualizados $(TZ=America/Sao_Paulo date '+%d/%m %H:%M') [skip ci]"
          git pull --rebase origin main && git push
