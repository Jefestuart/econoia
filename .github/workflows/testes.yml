name: Testes

on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
