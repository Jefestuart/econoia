name: Catálogo de indicadores

on:
  schedule:
    - cron: "47 11 * * *"   # todo dia, 8h47 de Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  series:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy
      - name: Testar antes de publicar
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Baixar séries, sazonalidade e previsões
        run: python scripts/series.py
      - name: Salvar se mudou
        run: |
          git config user.name "econoia-robo"
          git config user.email "robo@users.noreply.github.com"
          git add data/series.json
          git diff --cached --quiet || git commit -m "Indicadores atualizados $(TZ=America/Sao_Paulo date '+%d/%m %H:%M') [skip ci]"
          git pull --rebase origin main && git push
